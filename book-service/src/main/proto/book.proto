syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.lms.bookservice.grpc";
option java_outer_classname = "BookServiceProto";

service BookGrpcService {

  rpc GetBookAvailability (BookRequest) returns (BookResponse);

  rpc BorrowCopy (BookRequest) returns (BookResponse);

  rpc ReturnCopy (BookRequest) returns (BookResponse);
}

message BookRequest {
  int64 book_id = 1;
}

message BookResponse {
  int64 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  string category = 5;
  int32 total_copies = 6;
  int32 available_copies = 7;
  bool available = 8;
}
