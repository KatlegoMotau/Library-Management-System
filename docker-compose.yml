services:

  # Member Service
  member-service:
    build:
      context: ./member-service
      dockerfile: Dockerfile
    container_name: lms-member-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/member_db
      SPRING_DATASOURCE_USERNAME: postgres
    ports:
      - "8081:8081"
      - "9091:9091"
    networks:
      - lms-network

  # Book Service
  book-service:
    build:
      context: ./book-service
      dockerfile: Dockerfile
    container_name: lms-book-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/book_db
      SPRING_DATASOURCE_USERNAME: postgres
      REDIS_HOST: redis
    ports:
      - "8082:8082"
      - "9092:9092"
    networks:
      - lms-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    networks:
      - lms-network

  # Apache Kafka
  kafka:
    image: apache/kafka:4.1.1
    container_name: lms-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - lms-network

  # Borrowing Service
  borrowing-service:
    build:
      context: ./borrowing-service
      dockerfile: Dockerfile
    container_name: lms-borrowing-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/borrowing_db
      SPRING_DATASOURCE_USERNAME: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MEMBER_SERVICE_URL: http://member-service:8081
      BOOK_SERVICE_URL: http://book-service:8082
      SPRING_GRPC_CLIENT_CHANNEL_MEMBER_TARGET: static://member-service:9091
      SPRING_GRPC_CLIENT_CHANNEL_BOOK_TARGET: static://book-service:9092
    ports:
      - "8083:8083"
    depends_on:
      - member-service
      - book-service
      - kafka
    networks:
      - lms-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: lms-api-gateway
    restart: unless-stopped
    environment:
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://book-service:8082
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: "Path=/api/books/**"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://member-service:8081
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: "Path=/api/members/**"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://borrowing-service:8083
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: "Path=/api/borrowings/**"
    ports:
      - "8080:8080"
    depends_on:
      - member-service
      - book-service
      - borrowing-service
    networks:
      - lms-network

# Persistent Kafka storage
volumes:
  kafka-data:

# Docker Network
networks:
  lms-network:
    external: true
    name: lms-network
