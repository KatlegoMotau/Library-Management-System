spring.application.name=borrowing-service

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/borrowing_db
spring.datasource.username=postgres
spring.datasource.password=Kaklegom
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083

# Other microservices
member.service.url=http://localhost:8081
book.service.url=http://localhost:8082

# Member Service gRPC Client
spring.grpc.client.channel.member.target=static://localhost:9091

# Book Service gRPC Client
spring.grpc.client.channel.book.target=static://localhost:9092

# JWT Configuration
jwt.secret=${JWT_SECRET}
